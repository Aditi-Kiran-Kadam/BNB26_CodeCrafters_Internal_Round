<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GANIT.AI – SSC Maths Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'},startup:{typeset:false}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6ff;--panel:rgba(255,255,255,.75);--tx:#0f1733;--mut:#5b6489;--ac:#4f46e5;--ac2:#06b6d4;--bd:rgba(79,70,229,.2);--bub:#e8ecff;--glow:rgba(79,70,229,.15)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b1d;--panel:rgba(18,24,54,.7);--tx:#e6ebff;--mut:#8b95c9;--ac:#7c8cff;--ac2:#22d3ee;--bd:rgba(124,140,255,.25);--bub:#141b40;--glow:rgba(34,211,238,.18)}}
:root[data-theme="dark"]{--bg:#070b1d;--panel:rgba(18,24,54,.7);--tx:#e6ebff;--mut:#8b95c9;--ac:#7c8cff;--ac2:#22d3ee;--bd:rgba(124,140,255,.25);--bub:#141b40;--glow:rgba(34,211,238,.18)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent),radial-gradient(700px 500px at -10% 110%,var(--glow),transparent),var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;overflow:hidden}
#side{width:260px;background:var(--panel);backdrop-filter:blur(14px);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px;gap:10px;transition:transform .25s;z-index:5}
.logo{font-family:Orbitron,sans-serif;font-weight:800;font-size:19px;letter-spacing:1px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:12px;padding:9px 12px;cursor:pointer;font:inherit;font-size:14px}
.btn:hover{border-color:var(--ac);box-shadow:0 0 14px var(--glow)}
.btn.pri{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:700}
#hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--mut)}
.h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h.on,.h:hover{background:var(--bub);color:var(--tx)}.h b{opacity:.5;font-weight:400}.h b:hover{opacity:1;color:#ef4444}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--bd)}
header .t{flex:1;font-size:13px;color:var(--mut)}#menu{display:none}
#msgs{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.m{max-width:min(780px,92%);padding:12px 16px;border-radius:16px;line-height:1.6;font-size:15px;overflow-x:auto;word-wrap:break-word}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--panel);border:1px solid var(--bd);backdrop-filter:blur(10px);border-bottom-left-radius:4px}
.m img{max-width:220px;border-radius:10px;display:block;margin-bottom:8px}
.m h4{margin:12px 0 4px;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.8px;color:var(--ac2);text-transform:uppercase}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
.hero{margin:auto;text-align:center;max-width:620px}
.hero h1{font-family:Orbitron,sans-serif;font-size:clamp(26px,5vw,40px);margin:0 0 8px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:6px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--bd);background:var(--panel);color:var(--tx);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--ac2);box-shadow:0 0 12px var(--glow)}
#bar{padding:12px 18px 16px}
#box{max-width:860px;margin:auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:18px;padding:8px}
#box:focus-within{border-color:var(--ac);box-shadow:0 0 20px var(--glow)}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:15px;max-height:140px;padding:8px}
#prev{max-width:860px;margin:0 auto 6px;display:none;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
#prev img{height:44px;border-radius:8px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:0;background:var(--bub);color:var(--tx);cursor:pointer;font-size:17px}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ac2);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
.cp{display:block;margin-top:8px;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:8px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.m.u .cp{color:#fff;border-color:rgba(255,255,255,.5);margin-left:auto}
.cp:hover{border-color:var(--ac2);color:var(--tx)}.m.u .cp:hover{color:#fff}
small.f{display:block;text-align:center;color:var(--mut);font-size:11px;margin-top:6px}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:calc(14px + env(safe-area-inset-top,0px))}#side.open{transform:none}#menu{display:grid}}
:root{--ub:#3730a3}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ub:#4338ca}}:root[data-theme="dark"]{--ub:#4338ca}
.m.u{background:var(--ub)!important;color:#fff!important;border:1px solid rgba(255,255,255,.3);font-weight:500;box-shadow:0 4px 18px var(--glow)}
.m.u .ut{white-space:pre-wrap;font-size:15.5px}.m.u mjx-container{color:#fff}
.ok{color:#16a34a;display:block}.bad{color:#ef4444;display:block;font-weight:600}
.gw{margin-top:10px;background:var(--bub);border-radius:12px;padding:6px;max-width:380px;color:var(--tx)}.gr{width:100%;height:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row .cp{display:inline-block;margin-top:8px;margin-right:6px}
select.sel{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;font:inherit;font-size:13px}
.tg.on{background:var(--ac);color:#fff}.rec{background:#ef4444!important;color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:20;padding:16px}#modal.show{display:grid}
#mb{background:var(--bg);border:1px solid var(--bd);border-radius:18px;max-width:560px;width:100%;max-height:88%;overflow:auto;padding:18px;box-shadow:0 0 40px var(--glow)}
.bar{height:9px;border-radius:9px;background:var(--bub);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
#timer{font-family:Orbitron,sans-serif;font-size:12px;color:var(--ac2)}
#msgs>*{flex-shrink:0}.m{overflow-y:hidden}
</style>
</head>
<body>
<aside id="side">
  <div class="logo">GANIT.AI</div>
  <button class="btn pri" id="new">＋ New chat</button>
  <div id="hist"></div>
  <button class="btn" id="prog">📊 My progress</button>
  <button class="btn" id="exam">📝 Board exam mode</button>
  <button class="btn" id="kbBtn">📚 Add custom dataset</button>
  <input type="file" id="kbFile" accept=".txt,.md,.json,.csv" hidden>
  <button class="btn" id="theme">🌓 Light / Dark</button>
</aside>
<main>
  <header><button class="ic" id="menu">☰</button><div class="t">SSC Board (Maharashtra) · Std 9 &amp; 10 · Maths only <span id="timer"></span></div>
    <select class="sel" id="lang"><option>English</option><option value="Marathi">मराठी</option><option value="Hindi">हिंदी</option></select>
    <button class="btn tg" id="hintb" title="Get hints instead of full solutions">💡 Hint mode</button></header>
  <div id="msgs"></div>
  <div id="bar">
    <div id="prev"><img id="pimg" alt=""><span id="pname"></span><button class="btn" id="prm">✕</button></div>
    <div id="box">
      <button class="ic" id="cam" title="Upload photo (printed or handwritten)">📷</button>
      <input type="file" id="img" accept="image/*" hidden>
      <textarea id="in" rows="1" placeholder="Ask a maths question, or paste your working to check it…"></textarea>
      <select class="sel" id="conf" title="How sure are you of your answer?"><option value="">Confidence?</option><option value="sure">Sure</option><option value="not sure">Not sure</option><option value="guessing">Guessing</option></select>
      <button class="ic" id="mic" title="Speak your question">🎤</button>
      <button class="ic" id="go" style="background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff">➤</button>
    </div>
    <small class="f">Tip: send your question <b>and</b> your solution — I'll find where and why it went wrong.</small>
  </div>
</main>
<div id="modal"><div id="mb"></div></div>
<script>
const TOPICS=["Linear Equations in One Variable","Algebraic Identities","Polynomials","Pair of Linear Equations","Quadratic Equations","Factorisation","Arithmetic Progressions","Number Systems / Real Numbers"];
const WORKER_URL='https://ganit-ai.himanipatil1131.workers.dev';
const shrink=(f,mx=1280)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok({mime:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]})};i.onerror=no;i.src=URL.createObjectURL(f)});
let chats=[],cur=null,extra="",pending=null,busy=false;
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function load(){try{chats=JSON.parse(store.get('ganit_chats')||'[]')}catch(e){chats=[]}extra=store.get('ganit_kb')||"";const t=store.get('ganit_theme');if(t)document.documentElement.dataset.theme=t}
function save(){store.set('ganit_chats',JSON.stringify(chats.slice(0,60)))}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(s){return esc(s).replace(/^\*\*(.+?)\*\*\s*$/gm,'<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[-•]\s+/gm,'• ').replace(/\n/g,'<br>')}
function typeset(el){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).catch(()=>{})}
function newChat(){cur=null;pending=null;$('prev').style.display='none';renderHist();renderMsgs();$('side').classList.remove('open')}
function active(){return chats.find(c=>c.id===cur)}
function renderHist(){const h=$('hist');h.innerHTML='';chats.forEach(c=>{const d=document.createElement('div');d.className='h'+(c.id===cur?' on':'');const s=document.createElement('span');s.textContent=c.title;const x=document.createElement('b');x.textContent='✕';x.onclick=e=>{e.stopPropagation();chats=chats.filter(k=>k.id!==c.id);if(cur===c.id)cur=null;save();renderHist();renderMsgs()};d.onclick=()=>{cur=c.id;renderHist();renderMsgs();$('side').classList.remove('open')};d.append(s,x);h.append(d)})}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.append(x);x.select();const ok=document.execCommand('copy');x.remove();return ok}catch(e2){return false}}}
function addCopy(d,text,label){const b=document.createElement('button');b.className='cp';b.textContent='📋 '+label;b.onclick=async()=>{const ok=await copyText(text);b.textContent=ok?'✓ Copied':'Copy failed';setTimeout(()=>b.textContent='📋 '+label,1500)};d.append(b)}
const clean=t=>t.replace(/\[\[LOG:[^\]]*\]\]/g,'').replace(/\[\[GRAPH:[^\]]*\]\]/g,'').trim();
const steps=h=>h.replace(/(^|<br>)\s*(✅[^<]*)/g,'$1<span class="ok">$2</span>').replace(/(^|<br>)\s*(❌[^<]*)/g,'$1<span class="bad">$2</span>');
function bubble(m){const d=document.createElement('div');d.className='m '+(m.role==='user'?'u':'a');const c=document.createElement('div');
 if(m.role==='user'){c.innerHTML=(m.thumb?`<img src="data:image/jpeg;base64,${m.thumb}" alt="photo">`:(m.img?'<small>📷 photo attached</small><br>':''))+(m.content?`<div class="ut">${esc(m.content)}</div>`:'');d.append(c);addCopy(d,m.content||'','Copy prompt');return d}
 const raw=m.content;c.innerHTML=steps(md(clean(raw)));d.append(c);
 [...raw.matchAll(/\[\[GRAPH:([^\]]*)\]\]/g)].forEach(x=>{const g=graph(x[1]);if(g)d.append(g)});
 const r=document.createElement('div');r.className='row';d.append(r);addCopy(r,clean(raw),'Copy solution');addSpeak(r,clean(raw));return d}

function renderMsgs(){const box=$('msgs');box.innerHTML='';const c=active();if(!c||!c.msgs.length){box.innerHTML=`<div class="hero"><h1>Ask. Attempt. Understand.</h1><p>Your SSC Std 9 &amp; 10 maths tutor. Ask a question, or send your own solution and I'll find the exact concept you're missing.</p><div class="chips" id="chips"></div></div>`;const ex=["Solve $x^2-5x+6=0$","Expand $(2a-3b)^2$","Find the 15th term of AP 3, 7, 11…","Factorise $x^2+7x+12$"];ex.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{$('in').value=t;send()};$('chips').append(b)});TOPICS.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{$('in').value='Explain '+t+' with a worked example';send()};$('chips').append(b)});return}
c.msgs.forEach(m=>box.append(bubble(m)));typeset(box);box.scrollTop=box.scrollHeight}
async function send(){
  if(busy)return;const text=$('in').value.trim();if(!text&&!pending)return;
  let c=active();if(!c){c={id:Date.now()+'',title:(text||'Photo question').slice(0,34),msgs:[]};chats.unshift(c);cur=c.id}
  const img=pending;let thumb=null;if(img){try{thumb=(await shrink(img,150)).data}catch(e){}}
  c.msgs.push({role:'user',content:text,img:!!img,thumb});
  pending=null;$('prev').style.display='none';$('in').value='';$('in').style.height='auto';
  renderHist();renderMsgs();busy=true;
  const a=document.createElement('div');a.className='m a';a.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';$('msgs').append(a);$('msgs').scrollTop=1e9;
  const history=c.msgs.slice(-12).map(m=>({role:m.role,content:m.content||'[photo]'}));
  let out='';
  try{
    const image=img?await shrink(img):null;
    const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,image,extra,lang,hint,conf:$('conf').value})});
    const raw=await res.text();let j={};try{j=JSON.parse(raw)}catch(e){}
    if(!res.ok)throw{code:res.status,msg:j.error||('HTTP '+res.status+' '+raw.slice(0,120))};
    out=j.text||'';record(out);
  }catch(e){out='⚠️ '+(e&&e.code===429?'Too many requests – please wait a minute and try again.':'Something went wrong. Please try again.')+(e&&e.msg?' ('+e.msg+')':(e&&e.message?' ('+e.message+')':''))}
  $('conf').value='';c.msgs.push({role:'assistant',content:out||'…'});
  busy=false;save();renderHist();renderMsgs();
}
$('go').onclick=send;
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'});
$('new').onclick=newChat;$('menu').onclick=()=>$('side').classList.toggle('open');
$('cam').onclick=()=>$('img').click();
$('img').onchange=e=>{const f=e.target.files[0];if(!f)return;pending=f;$('pimg').src=URL.createObjectURL(f);$('pname').textContent=f.name;$('prev').style.display='flex';e.target.value=''};
$('prm').onclick=()=>{pending=null;$('prev').style.display='none'};
$('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('ganit_theme',r.dataset.theme)};
$('kbBtn').onclick=()=>$('kbFile').click();
$('kbFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;extra=(await f.text()).slice(0,60000);store.set('ganit_kb',extra);alert('Custom dataset loaded ('+extra.length+' characters).');e.target.value=''};
document.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){pending=it.getAsFile();$('pimg').src=URL.createObjectURL(pending);$('pname').textContent='pasted image';$('prev').style.display='flex'}});
let lang='English',hint=false;
const LOGK='ganit_log';
const getLog=()=>{try{return JSON.parse(store.get(LOGK)||'[]')}catch(e){return[]}};
function record(t){const l=getLog();[...t.matchAll(/\[\[LOG:([^\]]*)\]\]/g)].forEach(m=>{const o={};m[1].split(';').forEach(p=>{const i=p.indexOf('=');if(i>0)o[p.slice(0,i).trim()]=p.slice(i+1).trim()});if(o.topic)l.push({d:new Date().toISOString().slice(0,10),topic:o.topic,mis:(o.misconception||'none'),res:o.result||'wrong'})});store.set(LOGK,JSON.stringify(l.slice(-500)))}
function graph(spec){let [fs,rg]=spec.split(';');let [x0,x1]=(rg||'-6,6').split(',').map(Number);if(!(x1>x0)){x0=-6;x1=6}
 const cols=['#22d3ee','#f472b6','#facc15'],W=340,H=250,P=24;
 const fn=fs.split('|').map(q=>{q=q.replace(/^\s*y\s*=/i,'').replace(/\^/g,'**').replace(/(\d|\))\s*(x|\()/g,'$1*$2').replace(/x\s*\(/g,'x*(');if(!/^[0-9x+\-*\/().\s]+$/.test(q))return null;try{return{s:q.trim(),f:new Function('x','return '+q)}}catch(e){return null}}).filter(Boolean).slice(0,3);
 if(!fn.length)return null;
 const pts=fn.map(o=>{const a=[];for(let i=0;i<=160;i++){const x=x0+(x1-x0)*i/160;let y;try{y=o.f(x)}catch(e){y=NaN}a.push([x,y])}return a});
 const ys=pts.flat().map(p=>p[1]).filter(v=>Number.isFinite(v)&&Math.abs(v)<60);if(!ys.length)return null;
 let y0=Math.min(0,...ys),y1=Math.max(0,...ys);if(y1-y0<1){y1++;y0--}
 const sx=x=>P+(x-x0)/(x1-x0)*(W-2*P),sy=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
 let v=`<svg viewBox="0 0 ${W} ${H}" class="gr"><line x1="${P}" x2="${W-P}" y1="${sy(0)}" y2="${sy(0)}" stroke="currentColor" opacity=".5"/>`;
 if(x0<0&&x1>0)v+=`<line y1="${P}" y2="${H-P}" x1="${sx(0)}" x2="${sx(0)}" stroke="currentColor" opacity=".5"/>`;
 pts.forEach((a,i)=>{const d=a.filter(p=>Number.isFinite(p[1])&&p[1]>=y0-1&&p[1]<=y1+1).map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ');v+=`<polyline points="${d}" fill="none" stroke="${cols[i]}" stroke-width="2.5"/><text x="${P+4}" y="${14+i*13}" fill="${cols[i]}" font-size="11">y = ${fn[i].s.replace(/\*\*/g,'^')}</text>`});
 v+=`<text x="${W-P-8}" y="${sy(0)-4}" font-size="10" fill="currentColor">x</text><text x="${x0<0&&x1>0?sx(0)+4:P}" y="${P-8}" font-size="10" fill="currentColor">y</text></svg>`;
 const d=document.createElement('div');d.className='gw';d.innerHTML=v;return d}
const LC={English:'en-IN',Marathi:'mr-IN',Hindi:'hi-IN'};
function plain(t){return t.replace(/\$\$?([^$]+)\$\$?/g,(m,q)=>' '+q.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,'$1 over $2').replace(/\^2/g,' squared').replace(/\^3/g,' cubed').replace(/\\sqrt\{([^}]*)\}/g,'square root of $1').replace(/\\(times|cdot)/g,' times ').replace(/\\pm/g,' plus or minus ').replace(/[\\{}]/g,'').replace(/=/g,' equals ')+' ').replace(/\*\*/g,'').replace(/[✅❌]/g,'')}
function addSpeak(p,t){if(!window.speechSynthesis)return;const b=document.createElement('button');b.className='cp';b.textContent='🔊 Listen';b.onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();b.textContent='🔊 Listen';return}const u=new SpeechSynthesisUtterance(plain(t));u.lang=LC[lang];u.onend=()=>b.textContent='🔊 Listen';b.textContent='⏹ Stop';speechSynthesis.speak(u)};p.append(b)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('mic').onclick=()=>{if(!SR){alert('Voice input is not supported in this browser. Try Chrome.');return}if(rec){rec.stop();return}rec=new SR();rec.lang=LC[lang];rec.interimResults=false;$('mic').classList.add('rec');rec.onresult=e=>{$('in').value=($('in').value+' '+e.results[0][0].transcript).trim()};rec.onend=()=>{rec=null;$('mic').classList.remove('rec')};rec.onerror=()=>{};rec.start()};
$('lang').onchange=e=>{lang=e.target.value;store.set('ganit_lang',lang)};
$('hintb').onclick=()=>{hint=!hint;$('hintb').classList.toggle('on',hint)};
let tmr=null;
function ask(t){$('modal').classList.remove('show');$('in').value=t;send()}
$('exam').onclick=()=>{clearInterval(tmr);let sec=1800;const f=()=>{$('timer').textContent='⏱ '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec--<=0){clearInterval(tmr);$('timer').textContent="⏱ Time's up!"}};f();tmr=setInterval(f,1000);newChat();ask('Start BOARD EXAM MODE: set a 20-mark paper of 5 mixed questions from my 8 topics (Std 9 and 10, SSC style) with marks for each. Show only the questions. I will send my answers (typed or photo) and you will mark them step by step and diagnose every mistake.')};
function prog(){const L=getLog(),m=$('mb');const by={};TOPICS.forEach(t=>by[t]={n:0,s:0});L.forEach(r=>{const t=TOPICS.find(x=>r.topic&&x.toLowerCase().startsWith(r.topic.toLowerCase().slice(0,12)))||r.topic;by[t]=by[t]||{n:0,s:0};by[t].n++;by[t].s+=r.res==='correct'?1:r.res==='partly'?.5:0});
 const mc={};L.filter(r=>r.mis&&r.mis!=='none'&&r.res!=='correct').forEach(r=>{const k=r.topic+'|'+r.mis;mc[k]=(mc[k]||0)+1});const top=Object.entries(mc).sort((a,b)=>b[1]-a[1]).slice(0,6);
 m.innerHTML=`<div class="logo">My progress</div><p style="color:var(--mut);font-size:13px">Built from the answers you sent for checking (${L.length} so far). Stored only in this browser.</p>`+Object.keys(by).map(t=>{const v=by[t],p=v.n?Math.round(v.s/v.n*100):0;return `<div style="font-size:13px">${esc(t)} <b style="float:right">${v.n?p+'% · '+v.n+' checked':'not tried'}</b></div><div class="bar"><i style="width:${p}%"></i></div>`}).join('')+
 `<h4 style="margin:12px 0 6px">Your repeated mistakes</h4>`+(top.length?top.map(([k,n])=>`<div style="font-size:14px;margin:4px 0">• ${esc(k.split('|')[1])} <span style="color:var(--mut)">(${esc(k.split('|')[0])}) ×${n}</span></div>`).join(''):'<div style="color:var(--mut);font-size:13px">No mistakes recorded yet — send your working to be checked.</div>')+
 `<div class="row" style="margin-top:14px"><button class="btn pri" id="pw">🎯 Practice my weak spot</button><button class="btn" id="rv">📄 Revision sheet</button><button class="btn" id="ex">⬇ Export CSV</button><button class="btn" id="rs">Reset</button><button class="btn" id="cl">Close</button></div>`;
 $('modal').classList.add('show');$('cl').onclick=()=>$('modal').classList.remove('show');
 $('pw').onclick=()=>{const w=top[0];ask(w?`Give me 3 practice questions (Std 9/10 SSC level, increasing difficulty, no answers) targeting my repeated mistake "${w[0].split('|')[1]}" in ${w[0].split('|')[0]}. I will send my working for you to check.`:'Give me 3 mixed practice questions from my 8 topics, no answers. I will send my working for you to check.')};
 $('rv').onclick=()=>ask(top.length?'Make a one-page revision sheet for me: for each of these mistakes I repeat, give the correct rule, one worked example and one tip. Mistakes: '+top.map(([k])=>k.replace('|',' – ')).join('; '):'Make a one-page revision sheet of the key formulas and common mistakes for my 8 topics.');
 $('ex').onclick=()=>{const csv='date,topic,misconception,result\n'+L.map(r=>[r.d,r.topic,r.mis,r.res].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ganit_progress.csv';a.click()};
 $('rs').onclick=()=>{if(confirm('Delete all progress data?')){store.set(LOGK,'[]');prog()}}}
$('prog').onclick=()=>{prog();$('side').classList.remove('open')};
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};
lang=store.get('ganit_lang')||'English';$('lang').value=lang;

load();renderHist();renderMsgs();
</script>
</body>
</html>
